name: build

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++
      - name: Configure
        run: cmake --preset linux-gcc-debug
      - name: Build
        run: cmake --build --preset linux-gcc-debug
      - name: Test
        run: ctest --preset linux-gcc-debug

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Initialize MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Verify Windows build tools
        shell: pwsh
        run: |
          Get-Command cl
          cl 2>&1 | Select-Object -First 1
          cmake --version
          ninja --version
      - name: Configure
        run: cmake --preset windows-msvc-debug
      - name: Build
        run: cmake --build --preset windows-msvc-debug
      - name: Test
        run: ctest --preset windows-msvc-debug
